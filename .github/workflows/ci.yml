name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo -E apt-get update -qq -o Dpkg::Use-Pty=0
          sudo -E apt-get install -y -qq --no-install-recommends -o Dpkg::Use-Pty=0 \
            ninja-build \
            libsdl2-dev \
            libpng-dev \
            libjpeg-dev \
            libfmt-dev \
            libfreetype-dev \
            zlib1g-dev
          python3 -m pip install --user --break-system-packages cmake==4.1.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure desktop simulator
        run: cmake --preset linux-x86-64

      - name: Build desktop simulator
        run: cmake --build --preset linux-x86-64-dbg --parallel 2

      - name: Run desktop tests
        run: ctest --test-dir build/linux-x86-64 -C Debug --output-on-failure

      - name: Check Bluetooth discovery helper
        run: |
          python3 -m py_compile src/platform/helpers/bluetooth-session src/platform/helpers/wardrive-upload
          python3 tests/wardrive_upload_test.py

      - name: Validate store manifest
        run: cmake -P .agents/skills/cardputerzero-package-release/scripts/validate_app_builder.cmake

  arm64-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-build dependencies
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo -E apt-get update -qq -o Dpkg::Use-Pty=0
          sudo -E apt-get install -y -qq --no-install-recommends -o Dpkg::Use-Pty=0 \
            ninja-build \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu
          python3 -m pip install --user --break-system-packages cmake==4.1.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build ARM64 Debian package
        run: cmake --workflow --preset cp0-cross-package

      - name: Validate package and manifest
        run: |
          package="$(find dist -maxdepth 1 -type f -name 'Marauder_*_arm64.deb' -print -quit)"
          test -n "$package"
          test "$(dpkg-deb -f "$package" Architecture)" = arm64
          cmake -DPACKAGE_FILE="$package" \
            -P .agents/skills/cardputerzero-package-release/scripts/validate_app_builder.cmake
          dpkg-deb -x "$package" "$RUNNER_TEMP/marauder-payload"
          dpkg-deb -e "$package" "$RUNNER_TEMP/marauder-control"
          test -x "$RUNNER_TEMP/marauder-control/postinst"
          test -x "$RUNNER_TEMP/marauder-control/postrm"
          test -x "$RUNNER_TEMP/marauder-payload/usr/lib/marauder/bluetooth-session"
          test -x "$RUNNER_TEMP/marauder-payload/usr/lib/marauder/ble-hci-monitor"
          test -x "$RUNNER_TEMP/marauder-payload/usr/lib/marauder/wardrive-upload"
          test -f "$RUNNER_TEMP/marauder-payload/usr/share/APPLaunch/share/images/marauder-icon-v2.png"
          grep -Fqx 'Icon=share/images/marauder-icon-v2.png' "$RUNNER_TEMP/marauder-payload/usr/share/APPLaunch/applications/marauder_cardputerzero.desktop"
          visudo -cf "$RUNNER_TEMP/marauder-payload/usr/share/marauder_cardputerzero/marauder-monitor.sudoers"
          for dep in sudo iproute2 iw network-manager bluez gpsd python3 python3-dbus python3-gi systemd curl unzip; do
            dpkg-deb -f "$package" Depends | tr ',' '\n' | grep -Eq "^[[:space:]]*${dep}([[:space:]]|$)"
          done
          dpkg-deb -f "$package"
          dpkg-deb -c "$package"
          sha256sum "$package" > "$package.sha256"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: marauder-cardputerzero-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
